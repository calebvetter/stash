name: Build Custom Stash

on:
  push:
    branches:
      - custom-v0.31.1-scrollfix
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/custom/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GITHASH=${{ github.sha }}
            STASH_VERSION=v0.31.1-custom
          tags: |
            ghcr.io/calebvetter/stash:custom
            ghcr.io/calebvetter/stash:v0.31.1-scrollfix
